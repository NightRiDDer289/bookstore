name: Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy on Render
        id: trigger_deploy
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/srv-${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"clearCache\": \"do_not_clear\", \"commitId\": \"${{ github.sha }}\"}")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" != "201" ]; then
            echo "Erro ao acionar deploy. Verifique os secrets RENDER_API_KEY e RENDER_SERVICE_ID."
            exit 1
          fi

          DEPLOY_ID=$(echo "$BODY" | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Aguardar conclusão do deploy
        run: |
          DEPLOY_ID="${{ steps.trigger_deploy.outputs.deploy_id }}"
          echo "Acompanhando deploy: $DEPLOY_ID"

          for i in $(seq 1 30); do
            STATUS=$(curl -s \
              "https://api.render.com/v1/services/srv-${{ secrets.RENDER_SERVICE_ID }}/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              | python3 -c "import sys, json; print(json.load(sys.stdin)['status'])")

            echo "Status ($i/30): $STATUS"

            if [ "$STATUS" = "live" ]; then
              echo "Deploy concluído com sucesso!"
              exit 0
            elif [ "$STATUS" = "deactivated" ] || [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "update_failed" ]; then
              echo "Deploy falhou com status: $STATUS"
              exit 1
            fi

            sleep 20
          done

          echo "Timeout: deploy ainda em andamento após 10 minutos."
          exit 1
